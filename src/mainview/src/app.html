<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
  <title>Duvet</title>
  <meta name="description" content="A cozy place to talk: spaces with text and voice rooms, direct messages and groups." />
  <meta property="og:title" content="Duvet" />
  <meta property="og:description" content="A cozy place to talk: spaces with text and voice rooms, direct messages and groups." />
  <meta property="og:image" content="https://duvet.chat/opengraph-image.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <script>
    (() => {
      // The light theme (lib/theme.ts): the pick saved in Appearance, or the system's while it's System, dark when
      // the system says nothing. Set here, before anything paints, so a light system doesn't flash dark.
      try {
        const pick = localStorage.getItem("duvet.theme.v1");
        const systemLight = !!window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
        if (pick === "light" || (pick !== "dark" && systemLight)) document.documentElement.classList.add("duvet-light");
      } catch {}

      const path = window.location.pathname;
      const isDev = window.location.port === "5173";

      const r = (p) => {
        if (!isDev) return p;
        const map = {
          "/index.html": "/",
          "/app.html": "/app",
          "/sign-in.html": "/sign-in",
          "/sign-up.html": "/sign-up",
          "/forgot-password.html": "/forgot-password",
          "/invite.html": "/invite",
        };
        return map[p] || p;
      };

      if (path === "/index.html" || path === "/") {
        const secret = localStorage.getItem("duvet_session_token");

        if (!secret) {
          window.location.replace(r("/sign-in.html"));
        } else {
          window.location.replace(r("/app.html"));
        }
      }

      // The packaged app opens app.html itself (src/bun/index.ts), rather than index.html, which loaded it as a second
      // page: without a session, the page is sign-in's.
      if (path === "/app.html" && !localStorage.getItem("duvet_session_token")) {
        window.location.replace(r("/sign-in.html"));
      }

      // The gateway's socket starts here, as the page loads, rather than once the app's JavaScript has run: the
      // connection takes it on (takeEarlySocket, lib/api/ws/connection.ts). At the address the app last used
      // (duvet.start.v1), and not with tokens in their last hour (renewalFirst, lib/session.ts), which renew first.
      if ((path === "/app.html" || path === "/app") && !isDev) {
        try {
          const token = localStorage.getItem("duvet_session_token");
          const refreshedAt = Number(localStorage.getItem("duvet_session_refreshed_at")) || 0;
          const start = JSON.parse(localStorage.getItem("duvet.start.v1") || "null");
          if (token && start && typeof start.gateway === "string" && Date.now() - refreshedAt < 23 * 60 * 60 * 1000) {
            const socket = new WebSocket(start.gateway + "?token=" + token);
            socket.addEventListener("open", () => (window.__duvetEarlySocketOpenedAt = Date.now()));
            window.__duvetEarlySocket = socket;
          }
        } catch {}
      }
    })();
  </script>

  %sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover" class="select-none">
  <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
