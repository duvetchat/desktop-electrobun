name: Release

# The desktop's builds, on GitHub's runners: Electrobun builds only for the system it runs on.
#   - A tag v<package.json's version> on main publishes that version (#456): each system's stable build, signed and
#     published to the rolling desktop-stable release of the public duvetchat/releases, where the app's updater and
#     duvet.chat/download look. The windows job publishes stable-win-x64-*, the linux job stable-linux-x64-* (#590) and
#     the macos job stable-macos-arm64-* (#619), with the same steps, macOS's with Apple's signing and notarization among
#     them; each signed manifest names its platform, so none serves another system, and one system's job failing leaves
#     the others' releases as they go. Any other tag stops before the build.
#   - By hand (workflow_dispatch), the test channel (PLAN-E2E-CLIENTES.md, Task 34 and Ruling 9): the canary build of
#     the branch it's given, on the system it's given (Windows, Linux or macOS, unsigned), pointed at the API it's given
#     (lib/common/common.ts's targets; `local` is a stack on the same computer, at localhost:9876 and localhost:8765, as
#     docs/e2e-on-windows.md and docs/e2e-on-linux.md bring it up), whose installer goes into a prerelease of this
#     repository with the job's own token. It signs no update and never reaches desktop-stable: a canary doesn't update
#     itself (src/bun/updates.ts).
# Before either builds, the core's library it ships is checked against native/core/SOURCE.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or commit to build (empty, the one the workflow runs from)
        required: false
        default: ""
      system:
        description: The system to build for
        type: choice
        options: [windows, linux, macos]
        default: windows
      target:
        description: The API and gateway the build talks to
        type: choice
        options: [local, duvet, n128, andremor]
        default: local

permissions:
  contents: read

# One release at a time: a second waits, never cancels one halfway through its uploads. Test builds wait in a line of
# their own, so one never takes a waiting release's place.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'release-test' || 'release' }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    # The actions are pinned by commit, as this job signs: a tag moved upstream can't change what runs here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All of main, to tell whether the tag is on it.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Only the tag of package.json's version, on main
        shell: bash
        run: |
          version=$(bun -p "require('./package.json').version")
          if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
            echo "::error::$GITHUB_REF isn't v$version, package.json's version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::v$version isn't on main"
            exit 1
          fi
      # The DLL the build copies into the app (src/bun/e2e/library.ts), there and byte for byte the core's release.
      - name: The core's artifacts, as native/core/SOURCE.json records them
        run: bun test ./src/bun/core-artifacts.test.ts
      # svelte-kit starts with node (its shebang).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: src/mainview
      - run: bun run build:stable
      # ponytail: the key's step runs in the job whose installs ran the dependencies' scripts; a job of its own, handed
      # the build as an artifact, once the organisation's artifact storage takes one again (#458).
      - name: Sign the update
        run: bun scripts/sign-update.ts
        env:
          DESKTOP_UPDATE_SIGNING_KEY: ${{ secrets.DESKTOP_UPDATE_SIGNING_KEY }}
      - name: Publish to duvetchat/releases
        run: bun scripts/publish-release.ts
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

  # The windows job's steps, on Linux x64 (#590): src/bun/release-workflow.test.ts holds the two jobs to the same ones.
  # A Linux build carries the core, which no frame may reach before RM1 (#588), so a tag publishes one only once the
  # repository's RELEASE_LINUX variable says Linux is on (PLAN-E2E-PLATAFORMAS.md's turning on).
  linux:
    if: github.event_name == 'push' && vars.RELEASE_LINUX == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Only the tag of package.json's version, on main
        shell: bash
        run: |
          version=$(bun -p "require('./package.json').version")
          if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
            echo "::error::$GITHUB_REF isn't v$version, package.json's version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::v$version isn't on main"
            exit 1
          fi
      # The shared object the build copies into the app, as the windows job checks its DLL.
      - name: The core's artifacts, as native/core/SOURCE.json records them
        run: bun test ./src/bun/core-artifacts.test.ts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: src/mainview
      # stable-linux-x64-Duvet.tar.zst (the update), -Duvet-Setup.tar.gz (the installer) and -update.json.
      - run: bun run build:stable
      - name: Sign the update
        run: bun scripts/sign-update.ts
        env:
          DESKTOP_UPDATE_SIGNING_KEY: ${{ secrets.DESKTOP_UPDATE_SIGNING_KEY }}
      - name: Publish to duvetchat/releases
        run: bun scripts/publish-release.ts
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

  # The windows job's steps on macOS arm64 (#619), with Apple's among them: Duvet's Developer ID in a keychain of the
  # job's own, which the build signs every binary with, under the hardened runtime, before Apple notarizes the app, its
  # self-extracting bundle and the .dmg, each stapled. It publishes stable-macos-arm64-*, the .dmg among them.
  # src/bun/release-workflow.test.ts holds its other steps to the windows job's. Only a signed and notarized build
  # reaches desktop-stable (PLAN-E2E-PLATAFORMAS.md): without Apple's secrets the job stops before it builds, and a
  # notarization Apple refuses stops the build, before anything is published. Windows and Linux publish all the same.
  # A macOS build carries the core, which no frame may reach before RM1 (#588), so a tag publishes one only once the
  # repository's RELEASE_MACOS variable says macOS is on, as RELEASE_LINUX does for Linux.
  macos:
    if: github.event_name == 'push' && vars.RELEASE_MACOS == 'true'
    runs-on: macos-latest
    # Apple notarizes three times, each waited for.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Only the tag of package.json's version, on main
        shell: bash
        run: |
          version=$(bun -p "require('./package.json').version")
          if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
            echo "::error::$GITHUB_REF isn't v$version, package.json's version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::v$version isn't on main"
            exit 1
          fi
      # The Developer ID certificate (its .p12 in base64, and its password), and the Apple account that notarizes: the
      # Apple ID, an app-specific password for it, and the team's ID. Without any of them, nothing installs or builds.
      - name: Apple's secrets, or no build
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::No signed and notarized macOS build without these secrets:$missing"
            exit 1
          fi
      # The dylib the build copies into the app, as the windows job checks its DLL.
      - name: The core's artifacts, as native/core/SOURCE.json records them
        run: bun test ./src/bun/core-artifacts.test.ts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: src/mainview
      # The certificate in a keychain only this job has, its password made here, which codesign uses without asking. The
      # identity's SHA-1 is what the build signs with (ELECTROBUN_DEVELOPER_ID): Electrobun's binaries, and
      # scripts/build-native.ts's libraries, the core's among them.
      - name: Duvet's Developer ID, in a keychain of this job's own
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/developer-id.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          certificate="$RUNNER_TEMP/developer-id.p12"
          printf %s "$MACOS_CERTIFICATE" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / && !found { print $2; found = 1 }')
          if [ -z "$identity" ]; then
            echo "::error::The certificate holds no Developer ID Application identity"
            exit 1
          fi
          echo "ELECTROBUN_DEVELOPER_ID=$identity" >> "$GITHUB_ENV"
      # stable-macos-arm64-Duvet.app.tar.zst (the update), -Duvet.dmg (the installer) and -update.json, signed, notarized
      # and stapled (electrobun.config.ts).
      - run: bun run build:stable
        env:
          ELECTROBUN_APPLEID: ${{ secrets.APPLE_ID }}
          ELECTROBUN_APPLEIDPASS: ${{ secrets.APPLE_APP_PASSWORD }}
          ELECTROBUN_TEAMID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Sign the update
        run: bun scripts/sign-update.ts
        env:
          DESKTOP_UPDATE_SIGNING_KEY: ${{ secrets.DESKTOP_UPDATE_SIGNING_KEY }}
      - name: Publish to duvetchat/releases
        run: bun scripts/publish-release.ts
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

  test-channel:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.system == 'linux' && 'ubuntu-24.04' || inputs.system == 'macos' && 'macos-latest' || 'windows-latest' }}
    timeout-minutes: 30
    # Its token makes this repository's prerelease, and nothing else: it gets no secret of the stable channel's.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # The branch's own scripts run below: none of them finds the job's token in the checkout.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: The core's artifacts, as native/core/SOURCE.json records them
        run: bun test ./src/bun/core-artifacts.test.ts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: src/mainview
      - run: bun run build:canary
        env:
          VITE_DOMAIN_TARGET_ENV: ${{ inputs.target }}
      # The installer, and the build's update.json, whose hash the installed app's Resources/version.json has.
      - name: Into a prerelease of this repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT: ${{ inputs.ref || github.ref_name }}
          SYSTEM: ${{ inputs.system }}
          TARGET: ${{ inputs.target }}
        run: |
          sha=$(git rev-parse HEAD)
          tag="test-$GITHUB_RUN_NUMBER"
          ls -l artifacts
          case "$SYSTEM" in
            linux)
              files=(artifacts/canary-linux-x64-*Setup*.tar.gz artifacts/canary-linux-x64-update.json)
              how="Extract the tar.gz and run its installer: it installs over the canary this computer has, keeping its"
              how="$how data folder (~/.local/share/com.duvet.desktop/canary)." ;;
            macos)
              files=(artifacts/canary-macos-arm64-*.dmg artifacts/canary-macos-arm64-update.json)
              how="Open the dmg and drag the app into Applications. It's unsigned: macOS opens it only once it's allowed"
              how="$how in System Settings, Privacy & Security." ;;
            *)
              files=(artifacts/canary-win-x64-*Setup*.zip artifacts/canary-win-x64-update.json)
              how="Extract the zip and run Duvet-Setup-canary.exe: it installs over the canary this computer has, keeping"
              how="$how its data folder." ;;
          esac
          ls -l "${files[@]}"
          notes="The canary build of $BUILT at $sha, unsigned, talking to the $TARGET target's API and gateway"
          notes="$notes (local: localhost:9876 and localhost:8765). $how It never updates itself."
          gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --prerelease --target "$sha" \
            --title "Test build $GITHUB_RUN_NUMBER: $BUILT (${sha:0:7}, $SYSTEM, $TARGET)" --notes "$notes"
