# Lint (oxlint), formatting (Prettier) and type checks (tsc, svelte-check) on every pull request.
name: CI

# Only on pull requests into dev, and into e2e, where the end-to-end encryption work waits for its day. The
# dev to main promotion does not re-run it, since those pull requests already ran it. By hand from the
# Actions tab too.
on:
  pull_request:
    branches: [dev, e2e]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # On GitHub's runners, free for a public repository: the organisation's own runner takes only its private ones.
    runs-on: ubuntu-24.04
    # 30: a passing run takes 12 to 16 minutes, the browser tests (Task 8 of the E2E plan) and the engine's real cores
    # among them, and a runner busy with other repositories' runs stretches it past 20 (#538).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # svelte-kit and svelte-check start with node (their shebang).
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      # Before the lint: its type-aware rules read src/mainview's packages and the
      # .svelte-kit/tsconfig.json that this install's svelte-kit sync writes.
      - run: bun install --frozen-lockfile
        working-directory: src/mainview
      - run: bun run lint
      - run: bun run format:check
      # The Bun process's types (src/bun/tsconfig.json): svelte-check below reads the UI's only.
      - run: bun run check
      - run: bun run check
        working-directory: src/mainview
      # Each test file in a global object and module registry of its own: what one leaves can't reach another (#176).
      - run: bun test --isolate
        working-directory: src/mainview
      # The Bun process's own: the Spotify reader's parsing.
      - run: bun test src/bun
      # The core's key in a Secret Service, as a Linux desktop keeps it (src/bun/e2e/core.test.ts): gnome-keyring on a
      # session bus of the step's own, unlocked with a password of its own. The run above has no bus, where the key goes
      # to a file beside the database.
      - name: bun test, with a Secret Service
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dbus gnome-keyring
          dbus-run-session -- sh -c 'printf test | gnome-keyring-daemon --unlock --components=secrets && bun test src/bun/e2e/core.test.ts'
        env:
          DUVET_E2E_SECRET_SERVICE: "1"
      # The web's E2E core in a browser (scripts/web-e2e.ts): the Chrome this runner has, else Chrome for Testing in its
      # tool cache. Without one that runs here (none installs, or it lacks a system library), the step says so in a
      # warning and the tests are skipped.
      - name: Chrome for the browser tests
        id: chrome
        run: |
          for name in google-chrome google-chrome-stable chromium chromium-browser; do
            # A name that doesn't answer for its version within seconds is skipped: a snap's launcher, without snapd, hangs.
            if found=$(command -v "$name") && timeout 10 "$found" --version > /dev/null 2>&1; then
              echo "path=$found" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          if ! output=$(bunx @puppeteer/browsers@3.2.7 install chrome@stable --path "${RUNNER_TOOL_CACHE:-$HOME/.cache}/chrome-for-testing" 2>&1); then
            echo "$output"
            echo "::warning::No Chrome on this runner, and none could be installed: the browser tests are skipped"
            exit 0
          fi
          last=$(echo "$output" | tail -n 1)
          chrome="${last#* }"
          if [ ! -x "$chrome" ]; then
            echo "$output"
            echo "::warning::Chrome for Testing didn't say where it went: the browser tests are skipped"
            exit 0
          fi
          missing=$(ldd "$chrome" | grep "not found" | awk '{print $1}' | paste -sd ' ' || true)
          if [ -n "$missing" ]; then
            echo "::warning::Chrome for Testing lacks these libraries on this runner, so the browser tests are skipped: $missing"
            exit 0
          fi
          echo "path=$chrome" >> "$GITHUB_OUTPUT"
      - name: The web's core in Chrome
        if: steps.chrome.outputs.path != ''
        run: bun scripts/web-e2e.ts --browser chrome
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
          # Ubuntu's restriction of user namespaces leaves a Chrome outside its .deb's AppArmor profile no sandbox.
          CHROME_NO_SANDBOX: "1"
