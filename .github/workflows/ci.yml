# Lint (oxlint), formatting (Prettier) and type checks (tsc, svelte-check) on every pull request.
name: CI

# Only on pull requests into dev. The dev to main promotion does not re-run it, since those pull
# requests already ran it. By hand from the Actions tab too.
on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # On the organisation's own runner: the 2,000 free Actions minutes a month ran out.
    runs-on: [self-hosted, linux, x64, duvet]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # svelte-kit and svelte-check start with node (their shebang).
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      # Before the lint: its type-aware rules read src/mainview's packages and the
      # .svelte-kit/tsconfig.json that this install's svelte-kit sync writes.
      - run: bun install --frozen-lockfile
        working-directory: src/mainview
      - run: bun run lint
      - run: bun run format:check
      # The Bun process's types (src/bun/tsconfig.json): svelte-check below reads the UI's only.
      - run: bun run check
      - run: bun run check
        working-directory: src/mainview
      # Each test file in a global object and module registry of its own: what one leaves can't reach another (#176).
      - run: bun test --isolate
        working-directory: src/mainview
      # The Bun process's own: the Spotify reader's parsing.
      - run: bun test src/bun
