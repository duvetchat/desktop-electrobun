# Lint (oxlint), formatting (Prettier) and type checks (svelte-check) on every push to main and every
# pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # svelte-kit and svelte-check start with node (their shebang).
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      # Before the lint: its type-aware rules read src/mainview's packages and the
      # .svelte-kit/tsconfig.json that this install's svelte-kit sync writes.
      - run: bun install --frozen-lockfile
        working-directory: src/mainview
      - run: bun run lint
      - run: bun run format:check
      - run: bun run check
        working-directory: src/mainview
